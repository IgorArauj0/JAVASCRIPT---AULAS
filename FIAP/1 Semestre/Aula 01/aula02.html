<!-- Objetivo: compreender o papel do JavaScript em uma página web e executar os primeiros comandos. -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Minha primeira aula JS</title>
</head>
<body>

  <h1>Bem-vindo ao JavaScript!</h1>

  <button onclick="mostrarMensagem()">

    function mostrarMensagem() {
      alert("Olá, mundo!");
    }
  </script>

</body>
</html>
