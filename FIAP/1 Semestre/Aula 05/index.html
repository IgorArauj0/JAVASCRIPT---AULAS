<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    
<h2>Contador</h2>

<h1 id="numero">0</h1>

<button onclick="aumentar()">+</button>
<button onclick="diminuir()">-</button>

<script>
  let contador = 0;

  function aumentar() {
    contador++;
    document.getElementById("numero").innerText = contador;
  }

  function diminuir() {
    contador--;
    document.getElementById("numero").innerText = contador;
  }
</script>

</body>
</html>
